name: Server tests

on:
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omniroute_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U omni" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://omni:omni@localhost:5432/omniroute_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
